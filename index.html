<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1c2333;--mut:#6b7488;--line:#dfe3ec;--acc:#4f6bed;--red:#e5484d;--yel:#f5b301;--lg:#84d95a;--em:#047857;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef1f8;--mut:#98a2b8;--line:#2b3242;--acc:#7b8fff}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#eef1f8;--mut:#98a2b8;--line:#2b3242;--acc:#7b8fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
header h1{font-size:24px;margin:0;flex:1}
.burger{background:var(--card);color:var(--tx);width:46px;height:46px;font-size:24px;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:3px}
.tabs button{background:transparent;color:var(--mut);padding:9px 14px;font-size:15px}
.tabs button.on{background:var(--acc);color:#fff}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 14px 40px}
.in{max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.lbl{color:var(--mut);font-size:14px}
.badge{display:inline-block;min-width:64px;text-align:center;padding:5px 12px;border-radius:999px;font-weight:700;font-size:19px;color:#fff}
.badge.sm{min-width:54px;font-size:16px;padding:3px 10px}
.b-red{background:var(--red)}.b-yel{background:var(--yel);color:#2b2200}.b-lg{background:var(--lg);color:#12350a}.b-em{background:var(--em)}.b-none{background:var(--line);color:var(--mut)}
.add{display:flex;gap:10px}
input{font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);min-width:0;flex:1}
input:focus{outline:none;border-color:var(--acc)}
input[type=checkbox]{flex:none;width:22px;height:22px;padding:0;margin:0}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);padding:8px 10px;font-weight:500;font-size:14px}
button.ghost.sure{color:var(--red);font-weight:700}
button.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc);width:100%}
.head{display:flex;align-items:center;gap:12px;cursor:pointer}
.head .name{font-size:20px;font-weight:700;flex:1;word-break:break-word}
.chev{color:var(--mut);font-size:14px;width:16px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:17px;cursor:pointer}
.mrow .mn{flex:1;font-weight:600}
button.plus{background:transparent;color:var(--acc);border:1.5px solid var(--acc);padding:5px 10px;font-size:14px}
.det{padding:6px 0 4px}
